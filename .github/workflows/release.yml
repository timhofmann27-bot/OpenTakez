name: Release

# Push a tag like v1.0.0 to publish ghcr.io/<owner>/opentakez (amd64 + arm64) and a GitHub
# Release with the matching CHANGELOG.md section. Images are only rebuilt on tags; dependency
# updates arrive as Dependabot pull requests (.github/dependabot.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Nothing here pushes; don't leave a usable token in .git/config.
          persist-credentials: false
      - name: Check tag, versions, and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version="${TAG#v}"
          test "$(jq -r .version web/package.json)" = "$version"
          grep -Fqx "__version__ = \"$version\"" backend/app/__init__.py
          grep -Fqx "opentakez.version=$version" android/gradle.properties
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /[^[:space:]]/ { has_content = 1 }
            END { exit !(found && has_content) }
          ' CHANGELOG.md
          # Checking out a tag does not necessarily leave origin/main behind.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release commit must be on main"
            exit 1
          }

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Image name (GHCR needs lowercase)
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/opentakez" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          # Stable v1.2.3 → 1.2.3, v1.2.3, 1.2 and latest. A pre-release gets only its v tag.
          tags: |
            type=semver,pattern={{version}},enable=${{ !contains(github.ref_name, '-') }}
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=OpenTakez
            org.opencontainers.image.description=Self-hosted media downloader (yt-dlp, gallery-dl) with an installable PWA
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.description=Self-hosted media downloader (yt-dlp, gallery-dl) with an installable PWA
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Lets anyone verify how the published image was built and what went into it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  # Signed per-ABI APKs. The `release` environment holds the four ANDROID_* secrets and can
  # require a manual approval before this job (and so the key) is used.
  android-apk:
    runs-on: ubuntu-latest
    needs: checks
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper checksum. Read-only: a release build must not
      # write cache entries that other workflows would later trust.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Android platform 37.0
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          if [[ ! -d "$ANDROID_HOME/platforms/android-37.0" ]]; then
            "$sdkmanager" "platforms;android-37.0"
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing in the 'release' environment"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is missing in the 'release' environment"
              exit 1
            fi
          done
          ./gradlew assembleRelease

      - name: Verify signatures, name files, write SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="android/app/build/outputs/apk/release/app-$abi-release.apk"
            if [[ ! -f "$src" ]]; then
              echo "::error::Missing $src"
              exit 1
            fi
            # Fails (non-zero) for unsigned or tampered APKs.
            certs="$("$apksigner" verify --print-certs "$src")"
            if grep -q "Android Debug" <<< "$certs"; then
              echo "::error::$abi APK is signed with a debug key"
              exit 1
            fi
            echo "$abi: $(grep -m1 'certificate SHA-256 digest' <<< "$certs")"
            cp "$src" "dist/OpenTakez-$version-$abi.apk"
          done
          (cd dist && sha256sum OpenTakez-*.apk > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: dist/
          if-no-files-found: error

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  github-release:
    runs-on: ubuntu-latest
    needs: [image, android-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: dist

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Lines between "## [<version>]" and the next "## [" heading, without the link
          # definitions at the end of the file.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opentakez"
          {
            echo
            echo "### Docker image"
            echo
            echo "~~~sh"
            echo "docker pull $image:$version"
            echo "~~~"
            echo
            echo "Platforms: linux/amd64, linux/arm64."
            echo
            echo "### Android"
            echo
            echo "Pick the APK for your phone's CPU:"
            echo
            echo "- \`OpenTakez-$version-arm64-v8a.apk\`: nearly every phone from 2017 on. Choose this one if unsure."
            echo "- \`OpenTakez-$version-armeabi-v7a.apk\`: only old 32-bit devices."
            echo "- \`OpenTakez-$version-x86_64.apk\`: emulators and Chromebooks."
            echo
            echo "Verify a download with \`sha256sum -c --ignore-missing SHA256SUMS\`."
            echo "With [Obtainium](https://obtainium.imranr.dev), add this repository and set the APK filter"
            echo "to \`arm64-v8a\`; see [docs/android.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/android.md)."
          } >> notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "OpenTakez ${TAG#v}" \
              --notes-file notes.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/OpenTakez-*.apk dist/SHA256SUMS --clobber
