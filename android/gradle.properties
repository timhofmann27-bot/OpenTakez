# Single source of truth for the app version; must equal the repo's release tag (vX.Y.Z),
# web/package.json and backend/app/__init__.py. .github/workflows/release.yml checks this.
opentakez.version=1.1.0

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
