services:
  opentakez:
    build: .
    image: opentakez
    container_name: opentakez
    restart: unless-stopped
    ports:
      - "${OPENTAKEZ_PORT:-8000}:8000"
    env_file: .env
    volumes:
      # Generated token and temporary downloads (deleted after OPENTAKEZ_FILE_TTL_HOURS).
      - opentakez-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  opentakez-data:
