services:
  opentakez:
    build: .
    image: opentakez
    container_name: opentakez
    restart: unless-stopped
    ports:
      - "${OPENTAKEZ_PORT:-8000}:8000"
    env_file: .env
    volumes:
      # Temporary downloads only; deleted after OPENTAKEZ_FILE_TTL_HOURS.
      - opentakez-data:/data

volumes:
  opentakez-data:
